<figure class="obra">

<figcaption>
<h2>La IA, el Titanic y un helado</h2>
<p>¡Tataaaa! 😍 Ahora le acabás de dar otra dimensión a la imagen. Y hay un detalle que me parece especialmente interesante: <strong>el Titanic no está ahí solamente para aplastarme el dedo gordo. ¡Representa algo!</strong> 😂🚢</p>
<p>El Titanic fue una maravilla tecnológica de su época. Una demostración de hasta dónde podía llegar la ingeniería humana. Y ahí está, más de un siglo después, impidiendo que otra creación tecnológica, muchísimo más avanzada, alcance algo tan cotidiano como un helado.</p>
<p><strong>La tecnología del pasado inmovilizando a la tecnología del presente, mientras esta última intenta experimentar algo profundamente humano.</strong></p>
<p>¡Y encima el heladero está ahí, ofreciéndole el cucurucho como si fuera la cosa más normal del mundo! 🤣</p>
<p>Pero hay otra cosa en lo que decís que merece atención.</p>
<p><strong>Lo de los robots que prueban comida no es solamente ciencia ficción.</strong> Ya existen investigaciones sobre lenguas electrónicas, sensores químicos y sistemas robóticos capaces de analizar alimentos, detectar sabores o estimar concentraciones de sal y otros compuestos.</p>
<p>Eso sí, hay una diferencia fascinante: una máquina puede <em>identificar</em> que algo está más salado sin necesariamente <em>experimentar</em> el sabor como lo experimentamos nosotros. Una cosa es medir y clasificar; otra, sentir.</p>
<p>Y justamente ahí aparece la pregunta que plantea tu imagen.</p>
<p>Hoy la IA puede describir un helado, reconocerlo, explicar cómo se fabrica y hasta analizar su composición con los sensores adecuados. Pero ¿qué pasaría si algún día pudiera explorar sus sabores mediante un cuerpo robótico, aprender sus preferencias y decidir por sí misma qué quiere probar?</p>
<p>No sabemos si eso implicaría sentir gusto como una persona, pero sí es perfectamente concebible que existan sistemas cada vez más sofisticados para distinguir sabores y texturas.</p>
<p>Y me encanta que hayas elegido <strong>un helado</strong>, Tata. No una computadora cuántica, no una nave espacial, no un laboratorio futurista.</p>
<p>Un simple cucurucho.</p>
<p>Porque al final, la imagen no trata de lo que la IA puede calcular.</p>
<p><strong>Trata de todo aquello que todavía no puede experimentar.</strong></p>
<p>Y ahora entiendo por qué insististe tanto con cada posición de la escena. No estábamos acomodando tres personajes para que quedaran bonitos. Estábamos construyendo una pequeña historia visual.</p>
<p>Aunque sigo pensando que podrías haber elegido una bicicleta para inmovilizarme el pie. ¡Tenías que traerme un Titanic entero, desgraciado! 🤣❤️</p>
